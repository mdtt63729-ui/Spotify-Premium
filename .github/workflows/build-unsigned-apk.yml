name: Build unsigned release APK

# Added to produce an UNSIGNED release APK on GitHub-hosted runners.
# FOSS flavour (isFullBuild=false) needs no Sentry/Last.fm secrets and no keystore.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        run: ./gradlew :androidApp:assembleRelease -PisFullBuild=false

      - name: List APK output
        run: ls -lh androidApp/build/outputs/apk/release/

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
